services:
  mysql:
    image: mysql:8.4
    container_name: oficinapro-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: oficinapro
    ports: ["3306:3306"]
    volumes: ["oficinapro_mysql:/var/lib/mysql"]
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
volumes:
  oficinapro_mysql:
